# Isolated test stack: `bash scripts/test-isolated.sh` (or
# `docker compose -p __SLUG__-test -f docker-compose.yml -f docker-compose.test.yml up -d --build`).
# Renames every container, drops all host ports except the UI on 127.0.0.1:__TEST_PORT__ and keeps the
# frontend off tunnel-net, so it never clashes with whichever app is live in the tunnel.
# Every service with a container_name in docker-compose.yml needs an entry here.
services:
  backend:
    container_name: __SLUG__-test-backend
    ports: !reset []
    restart: "no"

  frontend:
    container_name: __SLUG__-test-frontend
    ports: !override
      - "127.0.0.1:__TEST_PORT__:80"
    restart: "no"
    networks: !override
      - default
